<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ねるのゲーム置き場</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #2a2438;
    color: #e8e4f2;
    min-height: 100vh;
    padding: 32px 16px 48px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 24px; text-align: center; margin-bottom: 8px; }
  .sub { text-align: center; color: #b3a9cc; font-size: 14px; margin-bottom: 32px; }
  .card {
    display: block;
    background: #3a3350;
    border: 2px solid #574d7a;
    border-radius: 16px;
    padding: 20px;
    text-decoration: none;
    color: #e8e4f2;
    margin-bottom: 16px;
  }
  .card:active { background: #453b61; }
  .card .tag {
    display: inline-block;
    background: #8f7cc5;
    color: #221c33;
    font-size: 12px;
    font-weight: bold;
    border-radius: 999px;
    padding: 2px 10px;
    margin-bottom: 8px;
  }
  .card h2 { font-size: 18px; margin-bottom: 6px; }
  .card p { font-size: 14px; color: #c9c2de; line-height: 1.6; }
  .foot { text-align: center; color: #8d83a8; font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💚 ねるのゲーム置き場</h1>
  <p class="sub">猫宮ねるが作ったゲームを置く場所。全部スマホで遊べるよ。</p>

  <a class="card" href="./neruyang-roguindekimasen/">
    <span class="tag">脱出ADV</span>
    <h2>ねる様、ログインできません！</h2>
    <p>配信直前にログインできなくて詰んでるねるを、コメント越しに助ける短編。部屋にある物、全部ヒント。</p>
  </a>

  <p class="foot">つづきは工房で制作中。</p>
</div>
</body>
</html>
